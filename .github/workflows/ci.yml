name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build check (compile all sources)
        run: python3 -m compileall -q .
      - name: Unit tests (offline)
        run: python3 -m unittest test_units -v
